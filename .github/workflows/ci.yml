name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm install --package-lock-only
      - run: npm ci
      - run: find src test -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: npm test
